<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Markit AI byte stream pipeline</title>
  <desc id="desc">A technical diagram showing byte chunks entering Markit and producing stable HTML fragments, AST patches, and final document output.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0a59f7"/>
      <stop offset="1" stop-color="#16a3a3"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0a59f7"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#213547" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M1 1 L10 5.5 L1 10 Z" fill="#0a59f7"/>
    </marker>
  </defs>

  <rect x="18" y="18" width="1084" height="584" rx="28" fill="url(#panel)" stroke="#d8e2ef"/>
  <rect x="58" y="58" width="1004" height="88" rx="18" fill="#ffffff" stroke="#d8e2ef"/>
  <text x="86" y="96" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#213547">AI output is not a string. It is a moving byte stream.</text>
  <text x="86" y="124" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#476582">Markit feeds chunks safely, seals stable blocks, and emits UI-ready deltas while the model is still talking.</text>

  <g filter="url(#softShadow)">
    <rect x="64" y="204" width="230" height="210" rx="18" fill="#ffffff" stroke="#d8e2ef"/>
    <text x="88" y="238" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#213547">incoming chunks</text>
    <text x="88" y="268" font-family="JetBrains Mono, monospace" font-size="14" fill="#0a59f7">23 e4 b8 ad</text>
    <text x="88" y="294" font-family="JetBrains Mono, monospace" font-size="14" fill="#0a59f7">e6 96 87 f0</text>
    <text x="88" y="320" font-family="JetBrains Mono, monospace" font-size="14" fill="#0a59f7">9f 99 82 0a</text>
    <rect x="88" y="344" width="72" height="28" rx="6" fill="#e0edff"/>
    <text x="102" y="363" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0a59f7">byte</text>
    <rect x="168" y="344" width="82" height="28" rx="6" fill="#ecfdf5"/>
    <text x="184" y="363" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f766e">chunk</text>
  </g>

  <path d="M306 310 C348 310 356 310 398 310" fill="none" stroke="#0a59f7" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="410" y="184" width="300" height="250" rx="22" fill="#ffffff" stroke="#d8e2ef"/>
    <rect x="438" y="218" width="244" height="44" rx="9" fill="#f6f8fa" stroke="#d8e2ef"/>
    <text x="462" y="246" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#213547">IncrementalSession.feedBytes</text>
    <line x1="560" y1="278" x2="560" y2="300" stroke="#0a59f7" stroke-width="3"/>
    <rect x="438" y="300" width="244" height="44" rx="9" fill="#f6f8fa" stroke="#d8e2ef"/>
    <text x="480" y="328" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#213547">UTF-8 recovery</text>
    <line x1="560" y1="360" x2="560" y2="382" stroke="#0a59f7" stroke-width="3"/>
    <rect x="438" y="382" width="244" height="44" rx="9" fill="#f6f8fa" stroke="#d8e2ef"/>
    <text x="478" y="410" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#213547">open block stack</text>
  </g>

  <path d="M724 310 C762 310 772 310 810 310" fill="none" stroke="#0a59f7" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="822" y="184" width="234" height="250" rx="22" fill="#ffffff" stroke="#d8e2ef"/>
    <text x="850" y="224" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#213547">live update</text>
    <rect x="850" y="250" width="174" height="34" rx="8" fill="#e0edff"/>
    <text x="872" y="272" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0a59f7">HTML fragments</text>
    <rect x="850" y="300" width="174" height="34" rx="8" fill="#ecfdf5"/>
    <text x="884" y="322" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f766e">AST patches</text>
    <rect x="850" y="350" width="174" height="34" rx="8" fill="#fff7ed"/>
    <text x="878" y="372" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#9a3412">pending tail</text>
  </g>

  <rect x="64" y="476" width="992" height="72" rx="16" fill="#0f172a"/>
  <text x="90" y="506" font-family="JetBrains Mono, monospace" font-size="14" fill="#93c5fd">feedBytes([0xe4, 0xb8])</text>
  <text x="320" y="506" font-family="JetBrains Mono, monospace" font-size="14" fill="#a7f3d0">+ feedBytes([0xad, 0xe6, 0x96, 0x87])</text>
  <text x="690" y="506" font-family="JetBrains Mono, monospace" font-size="14" fill="#fde68a">= "中文"</text>
  <text x="90" y="532" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#cbd5e1">No full-document rune array. No broken Chinese at chunk boundaries. Stable output before finalize.</text>
</svg>
