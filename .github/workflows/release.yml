name: Build markit-cli

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            archive: tar.gz
            sdk_url: https://gitcode.com/Cangjie/nightly_build/releases/download/1.3.0-alpha.20260812010048/cangjie-sdk-linux-x64-1.3.0-alpha.20260812010048.tar.gz
          - platform: macos-x64
            runner: macos-13
            archive: tar.gz
            sdk_url: https://gitcode.com/Cangjie/nightly_build/releases/download/1.3.0-alpha.20260812010048/cangjie-sdk-mac-x64-1.3.0-alpha.20260812010048.tar.gz
          - platform: macos-arm64
            runner: macos-14
            archive: tar.gz
            sdk_url: https://gitcode.com/Cangjie/nightly_build/releases/download/1.3.0-alpha.20260812010048/cangjie-sdk-mac-aarch64-1.3.0-alpha.20260812010048.tar.gz
          - platform: windows-x64
            runner: windows-latest
            archive: zip
            sdk_url: https://gitcode.com/Cangjie/nightly_build/releases/download/1.3.0-alpha.20260812010048/cangjie-sdk-windows-x64-1.3.0-alpha.20260812010048.zip

    steps:
      - uses: actions/checkout@v4

      - name: Download and configure Cangjie SDK (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cangjie-sdk"
          curl -fL --retry 3 "${{ matrix.sdk_url }}" -o "$RUNNER_TEMP/cangjie-sdk/archive"
          tar -xzf "$RUNNER_TEMP/cangjie-sdk/archive" -C "$RUNNER_TEMP/cangjie-sdk"
          setup=$(find "$RUNNER_TEMP/cangjie-sdk" -name envsetup.sh -type f | head -n 1)
          test -n "$setup"
          source "$setup"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "CANGJIE_HOME=${CANGJIE_HOME:-$(dirname "$(dirname "$setup")")}" >> "$GITHUB_ENV"

      - name: Download and configure Cangjie SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'cangjie-sdk'
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          Invoke-WebRequest -Uri '${{ matrix.sdk_url }}' -OutFile (Join-Path $sdk 'archive.zip')
          Expand-Archive -Path (Join-Path $sdk 'archive.zip') -DestinationPath $sdk -Force
          $setup = Get-ChildItem -Path $sdk -Filter envsetup.ps1 -Recurse | Select-Object -First 1
          if (-not $setup) { throw 'envsetup.ps1 was not found in the SDK archive' }
          . $setup.FullName
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CANGJIE_HOME=$($setup.Directory.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build markit-cli
        shell: bash
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cd markit-cli
          cjpm build

      - name: Build markit-cli (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          Set-Location markit-cli
          cjpm build

      - name: Assemble archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/markit-${{ matrix.platform }}"
          cp "markit-cli/target/release/bin/main" "dist/markit-${{ matrix.platform }}/markit"
          cp -R markit-cli/target/release/bin/assets "dist/markit-${{ matrix.platform }}/assets"
          tar -czf "markit-${{ matrix.platform }}.tar.gz" -C dist "markit-${{ matrix.platform }}"

      - name: Assemble archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = 'dist/markit-${{ matrix.platform }}'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item markit-cli/target/release/bin/main.exe "$root/markit.exe"
          Copy-Item markit-cli/target/release/bin/assets "$root/assets" -Recurse
          Compress-Archive -Path $root -DestinationPath 'markit-${{ matrix.platform }}.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: markit-${{ matrix.platform }}
          path: markit-${{ matrix.platform }}.${{ matrix.archive }}

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: markit-${{ matrix.platform }}.${{ matrix.archive }}
