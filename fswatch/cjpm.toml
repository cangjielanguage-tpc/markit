[package]
  cjc-version = "1.1.0"
  name = "fswatch"
  organization = ""
  description = "Cross-platform file monitoring core library for Cangjie language with high-performance filesystem event listening capabilities"
  version = "0.0.1"
  authors = ["zichexuelan"]
  repository = "https://gitcode.com/zichexuelan/markit.git"
  target-dir = "target"
  src-dir = "src"
  output-type = "static"
  tag = ["file-monitoring", "filesystem", "events", "cross-platform", "fswatch"]
  category = ["Infrastructure", "Utility", "Developer Tools"]
  license = ["Apache-2.0"]
  include = ["src", "native", "build.cj"]
  exclude = ["target", "tests"]
  compile-option = "--debug-macro -Woff unused"
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[dependencies]

[target.x86_64-apple-darwin.ffi.c]
  fswatch_macos.path = "./native/lib/darwin_x86_64"

[target.aarch64-apple-darwin.ffi.c]
  fswatch_macos.path = "./native/lib/darwin_aarch64"

[target.x86_64-unknown-linux-gnu.ffi.c]
  fswatch_linux.path = "./native/lib/linux_x86_64"

[target.aarch64-unknown-linux-gnu.ffi.c]
  fswatch_linux.path = "./native/lib/linux_aarch64"
