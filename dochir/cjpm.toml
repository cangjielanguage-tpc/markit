[package]
  cjc-version = "1.1.0"
  name = "dochir"
  organization = ""
  description = "nothing here"
  version = "1.0.0"
  target-dir = ""
  script-dir = ""
  output-type = "static"
  compile-option = ""
  override-compile-option = ""
  link-option = ""

[package.package-configuration."dochir.plugin"]
  output-type = "dynamic"

[dependencies]
  markit = { path = "../markit" }
  markit_kit = { path = "../markit-kit", output-type = "static" }
#----------------------------------------
#  Setting cangjie-stdx
#----------------------------------------
[target.x86_64-apple-darwin.bin-dependencies]
path-option = ["./libs/darwin_x86_64_cjnative/dynamic/stdx"]

[target.x86_64-unknown-linux-gnu.bin-dependencies]
path-option = ["./libs/linux_x86_64_cjnative/dynamic/stdx"]

[target.x86_64-unknown-windows-gnu.bin-dependencies]
path-option = ["./libs/windows_x86_64_cjnative/dynamic/stdx"]

[target.x86_64-unknown-windows-gnu]
link-option = "../dochir_plugin.def"

[target.x86_64-w64-mingw32.bin-dependencies]
path-option = ["./libs/windows_x86_64_cjnative/dynamic/stdx"]

[target.x86_64-w64-mingw32]
link-option = "../dochir_plugin.def"

[target.aarch64-unknown-linux-gnu.bin-dependencies]
path-option = ["./libs/linux_aarch64_cjnative/dynamic/stdx"]

[target.aarch64-apple-darwin.bin-dependencies]
path-option = ["./libs/darwin_aarch64_cjnative/dynamic/stdx"]
