[package]
  cjc-version = "1.1.0"
  name = "dochir_example"
  organization = ""
  description = "Sample package for testing the dochir CHIR plugin"
  version = "1.0.0"
  target-dir = ""
  script-dir = ""
  output-type = "executable"
  compile-option = ""
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[script-dependencies]
  dochir = { path = ".." }

[target.x86_64-apple-darwin]
compile-option = "-Woff unused --plugin=build-script-cache/release/dochir_example/libs/release/dochir/libdochir.plugin.dylib"

[target.x86_64-apple-darwin.bin-dependencies]
path-option = [
  "../libs/darwin_x86_64_cjnative/dynamic/stdx"
]

[target.x86_64-unknown-linux-gnu]
compile-option = "-Woff unused --plugin=build-script-cache/release/dochir_example/libs/release/dochir/libdochir.plugin.so"

[target.x86_64-unknown-linux-gnu.bin-dependencies]
path-option = [
  "../libs/linux_x86_64_cjnative/dynamic/stdx"
]

[target.x86_64-unknown-windows-gnu]
compile-option = "-Woff unused --plugin=build-script-cache/release/dochir_example/libs/release/dochir/libdochir.plugin.dll"

[target.x86_64-unknown-windows-gnu.bin-dependencies]
path-option = [
  "../libs/windows_x86_64_cjnative/dynamic/stdx"
]

[target.x86_64-w64-mingw32]
compile-option = "-Woff unused --plugin=build-script-cache/release/dochir_example/libs/release/dochir/libdochir.plugin.dll"

[target.x86_64-w64-mingw32.bin-dependencies]
path-option = [
  "../libs/windows_x86_64_cjnative/dynamic/stdx"
]

[target.aarch64-unknown-linux-gnu]
compile-option = "-Woff unused --plugin=build-script-cache/release/dochir_example/libs/release/dochir/libdochir.plugin.so"

[target.aarch64-unknown-linux-gnu.bin-dependencies]
path-option = [
  "../libs/linux_aarch64_cjnative/dynamic/stdx"
]

[target.aarch64-apple-darwin]
compile-option = "-Woff unused --plugin=build-script-cache/release/dochir_example/libs/release/dochir/libdochir.plugin.dylib"

[target.aarch64-apple-darwin.bin-dependencies]
path-option = [
  "../libs/darwin_aarch64_cjnative/dynamic/stdx"
]
